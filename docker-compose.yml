version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ngebeng-payment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ngebengpayment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ngebeng-payment-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ngebengpayment?schema=public"
      MIDTRANS_SERVER_KEY: "${MIDTRANS_SERVER_KEY}"
      MIDTRANS_CLIENT_KEY: "${MIDTRANS_CLIENT_KEY}"
      MIDTRANS_MERCHANT_ID: "${MIDTRANS_MERCHANT_ID}"
      JWT_SECRET: "${JWT_SECRET}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
